name: CI

on:
  push:
    branches: [main, '001-offline-mode', '002-real-bringup', '003-ingest-breadth', '004-identity', '005-per-person-history', '010-winui-client']
  pull_request:
    branches: [main, '001-offline-mode', '002-real-bringup', '003-ingest-breadth', '004-identity', '005-per-person-history', '010-winui-client']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Check formatting (CSharpier)
        run: dotnet csharpier check .

      # The WinUI 3 client (net8.0-windows + XAML compiler) cannot build on
      # Linux, so this job builds the RAGGit.Server.slnf filter (workstation,
      # libraries, Core behavior, all tests). The windows-client job below
      # builds the full solution including RAGGit.Client.WinUI.
      - name: Restore
        run: dotnet restore RAGGit.Server.slnf

      - name: Build
        run: dotnet build RAGGit.Server.slnf --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test --filter "FullyQualifiedName~Tests.Unit" --no-build --configuration Release

      - name: Contract tests
        run: dotnet test --filter "FullyQualifiedName~Tests.Contract" --no-build --configuration Release

      # WAN-disabled offline integration suite per Constitution IV/VI.
      # unshare -n removes network access while keeping localhost (fakes only, no
      # external egress). Must pass without Ollama per SC-003 (RequiresOllama skips).
      # 005-per-person-history runs here too: OfflineHistoryTests proves history/mine
      # are SQLite-only (SC-004) and CrossUserIsolationTests asserts 0 cross-user
      # leak (SC-002) under the same network isolation.
      # Hosted runners may forbid unshare → fallback to plain run with a warning.
      - name: WAN-disabled offline integration tests
        run: |
          if unshare -n true 2>/dev/null; then
            unshare -n dotnet test --filter "FullyQualifiedName~QueryOfflineTests|FullyQualifiedName~OfflineIdentityTests|FullyQualifiedName~OfflineHistoryTests|FullyQualifiedName~CrossUserIsolationTests" --no-build --configuration Release
          else
            echo "::warning::unshare not permitted on this runner, running offline tests without network isolation"
            dotnet test --filter "FullyQualifiedName~QueryOfflineTests|FullyQualifiedName~OfflineIdentityTests|FullyQualifiedName~OfflineHistoryTests|FullyQualifiedName~CrossUserIsolationTests" --no-build --configuration Release
          fi

      - name: Remaining integration tests (incl. SC-005 corruption, performance gate, RequiresOllama skips)
        run: dotnet test --filter "FullyQualifiedName~Tests.Integration&FullyQualifiedName!~QueryOfflineTests&FullyQualifiedName!~OfflineIdentityTests&FullyQualifiedName!~OfflineHistoryTests&FullyQualifiedName!~CrossUserIsolationTests" --no-build --configuration Release

      - name: Verify no Ollama required (SC-003)
        run: |
          echo "Plain dotnet test must be green without Ollama (fakes only, RequiresOllama skipped)"
          dotnet test --no-build --configuration Release --filter "RequiresOllama!=true" | tail -20

  # WinUI 3 desktop client: builds only on Windows (Windows App SDK + XAML
  # compiler). Builds the full solution plus an unsigned Release MSIX
  # artifact. Signing is an operator step (internal-CA cert) per README.
  windows-client:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RAGGit.sln

      - name: Build full solution
        run: dotnet build RAGGit.sln --no-restore --configuration Release -p:Platform=x64

      # Packaging props live on the BUILD (not publish --no-build): the Appx
      # targets only emit the final AppPackages/*.msix during build. Verified
      # locally: this exact command produces
      # bin/x64/Release/**/AppPackages/**/*.msix for the upload step below.
      - name: Build unsigned MSIX (packaging gate)
        run: dotnet build src/RAGGit.Client.WinUI/RAGGit.Client.WinUI.csproj --no-restore --configuration Release -p:Platform=x64 -p:AppxPackageSigningEnabled=false -p:GenerateAppxPackageOnBuild=true

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAGGit.Client.WinUI-msix
          # WindowsAppSDK 2.x emits the package to project-root AppPackages/
          # (1.x used bin/<platform>/<config>/<tfm>/AppPackages/).
          path: src/RAGGit.Client.WinUI/AppPackages/**/*.msix
